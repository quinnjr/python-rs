[package]
name = "python-rs"
version = "0.1.2"
edition = "2024"
description = "A stackless Python 3 interpreter written in Rust — academic/hobby AI-assisted port of CPython. Pre-release; not usable yet."
license = "MIT OR Apache-2.0"
repository = "https://github.com/quinnjr/python-rs"
homepage = "https://github.com/quinnjr/python-rs"
readme = "README.md"
keywords = ["python", "interpreter", "vm", "bytecode", "stackless"]
categories = ["compilers", "command-line-utilities"]
# Keep the published crate small: omit the vendored CPython 3.0.1 tree
# (~22 MB, PSF-licensed, used only at development/test time) and other
# files irrelevant to crate consumers.
exclude = [
    "vendor/**",
    "docs/**",
    "tests/cpython-3.0/**",
    "scripts/**",
    ".claude/**",
    ".gitattributes",
    "test_fizzbuzz.py",
]

[dependencies]
# Arbitrary-precision integers backing HeapObject::BigInt and the PyInt
# overflow path. Required for Python 3 int semantics — see M2 design spec.
num-bigint = "0.4"
# div_floor / mod_floor / div_mod_floor on BigInt; sister crate to num-bigint.
num-integer = "0.1"
# Sign extraction and unsigned-to-signed bridges for the hash algorithm.
num-traits = "0.2"
