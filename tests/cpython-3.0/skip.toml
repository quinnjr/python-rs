# Skip list for CPython 3.0 regression suite.
#
# Every entry in this file represents a test file from
# vendor/cpython-3.0/Lib/test/ that python-rs deliberately does not run.
# Each entry must declare a category and a human-readable reason.
#
# Categories (see design spec section "Skip-list policy"):
#   c_extension_deferred — needs a Tier-3 C module deferred to a later milestone
#   platform_specific    — only valid on an OS/arch we do not target
#   cpython_internal     — pokes at CPython implementation details we do not share
#   python_3_0_bug       — known failure on CPython 3.0 itself
#   temporary            — fixable, has tracking issue; discouraged
#
# The skip list is part of the design surface, not an escape hatch. Reviewed
# at every milestone boundary.

# ---------------------------------------------------------------------------
# Tier-3 C extensions deferred to post-M10 work
# ---------------------------------------------------------------------------

[skip.test_socket]
category = "c_extension_deferred"
reason = "Requires _socket. Deferred until cpyext milestone."

[skip.test_socketserver]
category = "c_extension_deferred"
reason = "Requires _socket."

